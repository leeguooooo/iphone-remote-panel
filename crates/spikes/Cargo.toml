[package]
name = "spikes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s1_input"
path = "src/bin/s1_input.rs"

[[bin]]
name = "s0_capture"
path = "src/bin/s0_capture.rs"

[[bin]]
# S1b re-probe: input via the session/HID event tap (CGEventPost) instead of
# the failed per-pid path (CGEventPostToPid). See SPIKE-RESULTS.md.
name = "s1b_session_input"
path = "src/bin/s1b_session_input.rs"

[[bin]]
# S0b-1 probe: capture the iPhone Mirroring window (same front-half as
# s0_capture) and hardware-encode it to realtime H.264 via VideoToolbox,
# writing a playable Annex-B elementary stream (s0b.h264).
name = "s0b_encode"
path = "src/bin/s0b_encode.rs"

[[bin]]
# S0b-2 probe: capture+encode (same front-half as s0b_encode) but stream the
# Annex-B H.264 over WebRTC (webrtc-rs) to a desktop browser on the LAN via a
# tiny HTTP+WebSocket signaling server.
name = "s0b2_webrtc"
path = "src/bin/s0b2_webrtc.rs"

[dependencies]
# elcapitan feature gates CGEvent::post_to_pid (CGEventPostToPid).
# highsierra is not needed — we use only mouse events, not scroll.
core-graphics = { version = "0.25.0", features = ["elcapitan"] }

# S0a capture probe: ScreenCaptureKit wrapper + PNG writer.
screencapturekit = "0.3"
# S0 re-probe: NSApplicationLoad() to initialise the CoreGraphics/WindowServer
# app context that SCStream.startCapture requires (fixes CGS_REQUIRE_INIT).
objc2-app-kit = "0.3"
# core-media-rs / core-video-rs are screencapturekit's own transitive deps; we
# depend on them directly to pull CMSampleBuffer / CVPixelBuffer pixels out.
# Versions pinned to what screencapturekit 0.3 resolves so there's one copy.
core-media-rs = "0.3.5"
core-video-rs = "0.3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
# S0b-1 VideoToolbox H.264 encode probe. objc2-video-toolbox exposes the real
# VTCompressionSession C API (VTCompressionSessionCreate / EncodeFrame /
# VTSessionSetProperty + all kVT* property/profile keys). objc2-core-media gives
# the encoded CMSampleBuffer -> CMBlockBuffer byte access + H264 parameter-set
# (SPS/PPS) extraction; objc2-core-foundation builds the CF property dicts.
objc2-video-toolbox = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
# core-foundation (0.10) is what core-video-rs/core-media-rs build on; we use its
# TCFType to pull the raw CVPixelBufferRef out of the SCK-captured pixel buffer
# and bridge it to objc2-core-video's CVImageBuffer for VTCompressionSessionEncodeFrame.
core-foundation = "0.10"

# S0b-2 WebRTC streaming probe.
# webrtc-rs: TrackLocalStaticSample runs the H264 RTP payloader internally; we
# feed it Annex-B access units via write_sample.
webrtc = "0.17"
# async runtime for the webrtc peer connection + signaling server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# tiny HTTP server: serves index.html + the /offer JSON signaling endpoint.
# Signaling is plain HTTP POST (browser is the offerer, non-trickle ICE — the
# answer SDP carries all LAN host candidates), so no WebSocket lib is needed.
tiny_http = "0.12"
# zero-copy byte buffers handed to webrtc Sample.data.
bytes = "1"
# SDP/ICE JSON payloads over the WebSocket.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
