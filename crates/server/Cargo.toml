[package]
name = "server"
version = "0.3.1"
edition = "2021"

# The daemon binary. Lib stays for unit-testable glue (http/signaling/webrtc
# decode helpers); the bin is the `iphone-use serve`/`stop` CLI entrypoint.
[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "iphone-use"
path = "src/main.rs"

[dependencies]
core = { path = "../core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Daemon integration layer.
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# async runtime + HTTP/WebSocket server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
axum = { version = "0.7", features = ["ws"] }

# WebRTC peer connection + H.264 track (matches the validated spike).
webrtc = "0.17"

# Cloudflare TURN: mint short-lived ICE creds over HTTPS, hot-swap on refresh.
# rustls-tls (no native-tls/openssl) — webrtc already pulls rustls in.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
arc-swap = "1"

# WDA (L2 element-tree control): screenshots arrive base64-encoded.
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# NSWorkspace + NSRunningApplication features power mirroring_is_frontmost()
# (cheap frontmost check so HID taps re-assert focus only when it was stolen).
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
core-graphics = { version = "0.25", features = ["elcapitan"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
arc-swap = "1"
