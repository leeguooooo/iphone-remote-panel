[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# input.rs — CgEventSink uses CGEvent::post(HID) for mouse injection.
# The elcapitan feature gates CGEventPostToPid (not needed here, but kept for
# parity with the spikes crate that confirmed the API surface).
# Only used on macOS; the CgEventSink impl is #[cfg(target_os = "macos")].
core-graphics = { version = "0.25", features = ["elcapitan"] }
