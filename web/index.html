<!doctype html>
<!--
  iPhone Remote — WebRTC web client  (web/index.html)
  =====================================================
  Served at /phone (auth-gated).  Daemon is the OFFERER.
  Signaling:  WebSocket /ws
  ICE creds:  GET /turn-creds  → {iceServers:[...]}
  Video:      recvonly track, ondatachannel for "control" (reliable) + "move" (lossy)
  Touch:      Pointer Events → normalized [0,1] content-rect coords

  Mobile UI: video is the hero (full-bleed). Chrome is a thumb-zone bottom toolbar +
  floating status pill + slide-up text panel + immersive collapse. Instrument-panel
  aesthetic: dark, monospace readouts, accent-glow active states. Safe-area aware.
  Ref:
    docs/superpowers/notes/2026-06-09-ios-safari-webrtc-client.md
    docs/superpowers/notes/2026-06-09-v1-feature-parity.md
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- [iOS-notes §Fullscreen/PWA] viewport-fit=cover for safe-area; initial-scale=1 required -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- [iOS-notes §Fullscreen/PWA] standalone PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08090c" />
  <title>iPhone Remote</title>
  <style>
    /* ── Design system: instrument-panel dark ────────────────────── */
    :root {
      color-scheme: dark;
      --bg:      #08090c;
      --panel:   #11131a;
      --panel-2: #161922;
      --line:    #272b38;
      --text:    #eef2ff;
      --muted:   #8b93a7;
      --accent:  #4f8cff;
      --accent-dim: #1a2a4a;
      --ok:      #4ade80;
      --warn:    #facc15;
      --danger:  #ff5a66;
      --danger-bg:  #2a1116;
      --danger-border: #5b1b24;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      --tb-h: 64px;                 /* toolbar height (content) */
      /* Space the video must leave at the bottom so the floating toolbar never
         covers the phone screen. Immersive mode (toolbar hidden) reclaims it. */
      --tb-reserve: calc(var(--tb-h) + env(safe-area-inset-bottom) + 14px);
    }
    /* --tb-reserve is corrected to the toolbar's real measured height by
       syncToolbarReserve() (and set to 0 in immersive mode); the calc above is
       just a first-paint fallback. */
    *, *::before, *::after { box-sizing: border-box; }

    /* [iOS-notes §Touch] suppress scroll/zoom/callout on html+body */
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ── App shell: video fills, toolbar floats over the bottom ───── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;               /* [iOS-notes] 100dvh not 100vh */
    }

    /* ── Video area: full-bleed hero ─────────────────────────────── */
    #videoArea {
      flex: 1 1 0;
      position: relative;
      background:
        radial-gradient(120% 80% at 50% 0%, #0c0e14 0%, #050608 70%);
      overflow: hidden;
      /* [iOS-notes §Touch] */
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }

    /* [iOS-notes §Video] The video sits ABOVE the floating toolbar so the toolbar
       never covers the phone's bottom (and taps there don't hit the toolbar).
       Use an explicit HEIGHT, not `bottom`: <video> is a replaced element, and
       width:100% + its intrinsic aspect ratio would otherwise drive the height
       past `bottom` and back behind the toolbar. getBoundingClientRect() then
       yields the visible rect, so the content-rect / coordinate math stays correct. */
    #screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: calc(100% - var(--tb-reserve));
      object-fit: contain;          /* letterbox; required for content-rect math */
      background: #000;
      pointer-events: none;         /* pointer events handled on #videoArea */
      touch-action: none;
      transition: height .28s cubic-bezier(.2,.7,.2,1);
    }
    /* subtle device-screen vignette + inset ring so the mirror reads as "a screen" */
    #videoArea::after {
      content: ""; position: absolute;
      top: 0; left: 0; width: 100%;
      height: calc(100% - var(--tb-reserve)); pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03),
                  inset 0 30px 60px -30px rgba(0,0,0,.5);
      transition: height .28s cubic-bezier(.2,.7,.2,1);
    }

    #gridCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: calc(100% - var(--tb-reserve));
      pointer-events: none; display: none;
      transition: height .28s cubic-bezier(.2,.7,.2,1);
    }
    #gridCanvas.on { display: block; }

    /* Tap dot (v1: 350ms fade) */
    #tapDot {
      position: absolute; width: 30px; height: 30px;
      border: 2px solid #fff; background: rgba(79,140,255,.35);
      border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 5;
      box-shadow: 0 0 16px 2px rgba(79,140,255,.5);
    }

    /* ── Floating status pill (top, under notch) ─────────────────── */
    #statusPill {
      position: absolute; z-index: 8;
      top: calc(env(safe-area-inset-top) + 10px);
      left: calc(env(safe-area-inset-left) + 12px);
      display: flex; align-items: center; gap: 7px;
      padding: 6px 11px;
      background: rgba(10,12,18,.62);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 999px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      max-width: min(70vw, 320px);
    }
    #statusPill .conn-dot { font-size: 9px; line-height: 1; color: var(--warn); transition: color .3s; }
    #statusPill .conn-dot.ok  { color: var(--ok); filter: drop-shadow(0 0 4px rgba(74,222,128,.7)); }
    #statusPill .conn-dot.warn{ color: var(--warn); }
    #statusPill .conn-dot.bad { color: var(--danger); }
    #statusLine {
      font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
      color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── "Tap to start" play overlay ─────────────────────────────── */
    #playOverlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: rgba(6,7,11,.86);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      cursor: pointer;
    }
    #playOverlay .pulse {
      width: 92px; height: 92px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(79,140,255,.12);
      border: 1px solid rgba(79,140,255,.4);
      box-shadow: 0 0 0 0 rgba(79,140,255,.4);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(79,140,255,.35); }
      70%  { box-shadow: 0 0 0 22px rgba(79,140,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,140,255,0); }
    }
    #playOverlay svg { width: 40px; height: 40px; fill: var(--accent); margin-left: 4px; }
    #playOverlay p { color: var(--text); font-size: 15px; margin: 0; letter-spacing: .04em; }
    #playOverlay.hidden { display: none; }

    /* ── Bottom toolbar (thumb zone) ─────────────────────────────── */
    #toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; gap: 4px; align-items: stretch;
      padding: 8px calc(env(safe-area-inset-left) + 8px)
               calc(env(safe-area-inset-bottom) + 8px)
               calc(env(safe-area-inset-right) + 8px);
      background: linear-gradient(to top, rgba(8,9,12,.96), rgba(8,9,12,.82));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      transition: transform .28s cubic-bezier(.2,.7,.2,1), opacity .2s;
    }
    #toolbar::-webkit-scrollbar { display: none; }
    body.immersive #toolbar { transform: translateY(120%); opacity: 0; pointer-events: none; }

    .tbtn {
      flex: 1 0 auto; min-width: 52px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 8px; min-height: 48px;
      background: transparent; border: 1px solid transparent; border-radius: 12px;
      color: var(--muted); font-family: var(--sans); cursor: pointer;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tbtn:active { background: var(--panel-2); }
    .tbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tbtn .lbl { font-size: 10px; line-height: 1; letter-spacing: .02em; white-space: nowrap; }
    .tbtn.active {
      color: var(--accent); background: var(--accent-dim);
      border-color: rgba(79,140,255,.35);
      box-shadow: 0 0 14px -4px rgba(79,140,255,.6);
    }
    .tbtn.danger { color: #ff8a93; }
    .tbtn.danger:active { background: var(--danger-bg); }
    .tbtn.spacer { flex: 1 1 auto; min-width: 4px; pointer-events: none; }

    /* freeze: swap icon by .active (the JS only toggles .active + .lbl text) */
    .tbtn .ico-play { display: none; }
    .tbtn.active .ico-pause { display: none; }
    .tbtn.active .ico-play { display: inline; }

    /* ── Grabber to restore chrome when immersive ────────────────── */
    #grabber {
      position: fixed; z-index: 29; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      width: 64px; height: 26px; border-radius: 999px;
      background: rgba(10,12,18,.7); border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #grabber::before { content: ""; width: 30px; height: 4px; border-radius: 2px; background: var(--muted); }
    body.immersive #grabber { display: flex; }

    /* ── Slide-up text panel ─────────────────────────────────────── */
    #textPanel {
      position: fixed; left: 0; right: 0; z-index: 40;
      bottom: calc(var(--tb-h) + env(safe-area-inset-bottom) + 8px);
      display: flex; gap: 8px; align-items: center;
      padding: 10px calc(env(safe-area-inset-left) + 12px) 10px calc(env(safe-area-inset-right) + 12px);
      background: rgba(14,16,22,.98);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      transform: translateY(160%); opacity: 0; pointer-events: none;
      transition: transform .26s cubic-bezier(.2,.7,.2,1), opacity .2s;
    }
    #textPanel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #textInput {
      flex: 1 1 auto; min-width: 0;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font-size: 16px;     /* 16px avoids iOS focus-zoom */
      font-family: var(--sans); -webkit-appearance: none;
    }
    #textInput:focus { outline: none; border-color: var(--accent); }
    #btnSend {
      flex: 0 0 auto; background: var(--accent); border: 1px solid var(--accent);
      color: #fff; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; -webkit-appearance: none;
    }
    #btnTextClose {
      flex: 0 0 auto; background: transparent; border: 1px solid var(--line);
      color: var(--muted); border-radius: 12px; padding: 12px 12px; font-size: 14px; cursor: pointer;
    }

    /* ── Toast (v1: 1600ms) ─────────────────────────────────────── */
    #toast {
      position: fixed; left: 50%;
      bottom: calc(var(--tb-h) + env(safe-area-inset-bottom) + 24px);
      transform: translateX(-50%) translateY(8px);
      background: rgba(17,24,39,.96); border: 1px solid var(--line);
      color: var(--text); padding: 9px 15px; border-radius: 12px; font-size: 13px;
      opacity: 0; transition: opacity .2s, transform .2s; z-index: 99;
      max-width: 86vw; pointer-events: none; text-align: center;
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">
  <!-- ── Video + interaction surface (hero) ────────────────────── -->
  <div id="videoArea">
    <video id="screen" autoplay playsinline webkit-playsinline muted
           disablePictureInPicture disableRemotePlayback></video>
    <canvas id="gridCanvas"></canvas>
    <div id="tapDot"></div>

    <!-- floating status pill -->
    <div id="statusPill">
      <span class="conn-dot">&#9679;</span>
      <span id="statusLine">connecting…</span>
    </div>

    <!-- [iOS-notes §Video] "Tap to start" play() gesture fallback -->
    <div id="playOverlay">
      <span class="pulse">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7L8 5z"/></svg>
      </span>
      <p>轻触以开始</p>
    </div>
  </div>
</div><!-- #app -->

<!-- ── Bottom toolbar (thumb zone, v1 parity + WebRTC affordances) ── -->
<nav id="toolbar" aria-label="控制栏">
  <button id="btnHome" class="tbtn" title="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span class="lbl">Home</span>
  </button>
  <button id="btnSearch" class="tbtn" title="Spotlight 搜索">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <span class="lbl">搜索</span>
  </button>
  <button id="btnSwitcher" class="tbtn" title="App 切换">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
    <span class="lbl">切换器</span>
  </button>
  <button id="btnGrid" class="tbtn" title="数字网格覆盖">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
    <span class="lbl">网格</span>
  </button>
  <button id="btnFreeze" class="tbtn" title="暂停/继续渲染">
    <svg class="ico-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
    <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z" fill="currentColor" stroke="none"/></svg>
    <span class="lbl">冻结</span>
  </button>
  <button id="btnKeyboard" class="tbtn" title="文字输入">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M6 14h0M18 14h0M9 14h6"/></svg>
    <span class="lbl">键盘</span>
  </button>
  <button id="btnLogout" class="tbtn danger" title="退出">
    <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>
    <span class="lbl">退出</span>
  </button>
  <span class="tbtn spacer" aria-hidden="true"></span>
  <button id="btnImmersive" class="tbtn" title="全屏（收起控制栏）">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M3 16v3a2 2 0 002 2h3"/></svg>
    <span class="lbl">全屏</span>
  </button>
</nav>

<!-- restore handle when immersive -->
<button id="grabber" aria-label="显示控制栏"></button>

<!-- slide-up text panel (opened by 键盘) -->
<div id="textPanel">
  <input id="textInput" type="text" placeholder="输入到手机…" maxlength="500"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" />
  <button id="btnSend" class="primary">发送</button>
  <button id="btnTextClose">关闭</button>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   iPhone Remote — WebRTC client
   Contract legend:
     [SIG] signaling (/ws)  [ICE] /turn-creds + ICE  [CH] data channels
     [TOUCH] Pointer Events  [iOS] Safari notes  [v1] parity affordance
   ================================================================ */
'use strict';

/* ── Constants ────────────────────────────────────────────────── */
const TAP_MS       = 250;
const TAP_SLOP     = 10;
const LONGPRESS_MS = 500;
const MOVE_BACKPRESSURE_BYTES = 256 * 1024;
const STATS_INTERVAL_MS = 2000;
const ICE_RESTART_DEBOUNCE_MS = 2000;
const RECONNECT_BASE_MS = 1500;

/* ── DOM refs ─────────────────────────────────────────────────── */
const video       = document.getElementById('screen');
const videoArea   = document.getElementById('videoArea');
const gridCanvas  = document.getElementById('gridCanvas');
const tapDot      = document.getElementById('tapDot');
const playOverlay = document.getElementById('playOverlay');
const statusLine  = document.getElementById('statusLine');
const toastEl     = document.getElementById('toast');
const textInput   = document.getElementById('textInput');

/* ── State ────────────────────────────────────────────────────── */
let pc = null, ws = null, controlCh = null, moveCh = null;
let frozen = false, gridOn = false, wakeLock = null;
let iceRestartTimer = null, reconnectTimer = null;
let reconnectDelay = RECONNECT_BASE_MS, statsInterval = null;
let lastRtt = '--', connState = 'new';

/* ── Toast ────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1600);
}

/* ── Status line ──────────────────────────────────────────────── */
function setStatus(msg) { statusLine.textContent = msg; }
function updateStatusLine() {
  const rtt = lastRtt !== '--' ? ` · ${lastRtt}ms` : '';
  setStatus(`${connState}${rtt}`);
}

/* ── Wake Lock [iOS §Wake Lock] ───────────────────────────────── */
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    if (wakeLock && !wakeLock.released) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (_) {}
}

/* ── Play() with fallback overlay [iOS §Video] ────────────────── */
async function tryPlay() {
  if (video.srcObject == null) return;
  try { await video.play(); playOverlay.classList.add('hidden'); acquireWakeLock(); }
  catch (_) { playOverlay.classList.remove('hidden'); }
}
playOverlay.addEventListener('pointerup', async (e) => {
  e.stopPropagation();
  try { await video.play(); playOverlay.classList.add('hidden'); acquireWakeLock(); } catch (_) {}
});

/* ── Visibility change: re-play + WakeLock + ICE restart [iOS] ── */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (video.srcObject && video.paused && !frozen) tryPlay();
    acquireWakeLock();
    if (pc && (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed')) scheduleIceRestart();
  }
});

/* ── Grid overlay (v1: 12×24, numbered 1–288) ─────────────────── */
function drawGrid() {
  if (!gridOn) return;
  // Measure the canvas's own box (it sits above the toolbar via CSS --tb-reserve),
  // not the full videoArea — keeps the grid aligned with the visible video.
  const rect = gridCanvas.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  gridCanvas.width  = Math.round(rect.width  * dpr);
  gridCanvas.height = Math.round(rect.height * dpr);
  const ctx = gridCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  const COLS = 12, ROWS = 24;
  ctx.strokeStyle = 'rgba(255,60,60,.55)'; ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { const x = rect.width * c / COLS; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,rect.height); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { const y = rect.height * r / ROWS; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(rect.width,y); ctx.stroke(); }
  ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = 'rgba(255,80,80,.9)'; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
  let n = 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = rect.width*c/COLS + 3, y = rect.height*r/ROWS + 12;
    ctx.strokeText(String(n), x, y); ctx.fillText(String(n), x, y); n++;
  }
}
window.addEventListener('resize', () => { if (gridOn) drawGrid(); });

/* ── Content-rect coord mapping [iOS §Touch] ──────────────────── */
function pointerToNormalized(clientX, clientY) {
  const rect = video.getBoundingClientRect();
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const elAR = rect.width / rect.height, vidAR = vw / vh;
  let contentW, contentH, offX, offY;
  if (elAR >= vidAR) { contentH = rect.height; contentW = rect.height * vidAR; offX = rect.left + (rect.width - contentW)/2; offY = rect.top; }
  else               { contentW = rect.width;  contentH = rect.width / vidAR;  offX = rect.left; offY = rect.top + (rect.height - contentH)/2; }
  const nx = (clientX - offX) / contentW, ny = (clientY - offY) / contentH;
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return null;
  return { nx, ny };
}

/* ── Control / move channels [CH] ─────────────────────────────── */
function sendControl(obj) {
  if (!controlCh || controlCh.readyState !== 'open') return;
  try { controlCh.send(JSON.stringify(obj)); } catch (_) {}
}
function sendMove(nx, ny, flags) {
  if (!moveCh || moveCh.readyState !== 'open') return;
  if (moveCh.bufferedAmount > MOVE_BACKPRESSURE_BYTES) return;
  const buf = new ArrayBuffer(5), view = new DataView(buf);
  view.setUint16(0, Math.round(nx * 65535), false);
  view.setUint16(2, Math.round(ny * 65535), false);
  view.setUint8(4, flags & 0xff);
  try { moveCh.send(buf); } catch (_) {}
}
/* Swipe → scroll-wheel. 7-byte packet: [u16 nx][u16 ny][i8 dx][i8 dy][u8 flags=0x02].
   nx/ny anchor the cursor; dx/dy are per-move CSS-pixel deltas. iPhone Mirroring
   only scrolls on scroll-wheel events, so swipes go here (NOT sendMove, which is a
   mouse-drag → long-press/reorder and never scrolls). */
const clampI8 = v => Math.max(-127, Math.min(127, Math.round(v)));
function sendScroll(nx, ny, dx, dy) {
  if (!moveCh || moveCh.readyState !== 'open') return;
  if (moveCh.bufferedAmount > MOVE_BACKPRESSURE_BYTES) return;
  const buf = new ArrayBuffer(7), view = new DataView(buf);
  view.setUint16(0, Math.round(nx * 65535), false);
  view.setUint16(2, Math.round(ny * 65535), false);
  view.setInt8(4, clampI8(dx));
  view.setInt8(5, clampI8(dy));
  view.setUint8(6, 0x02);
  try { moveCh.send(buf); } catch (_) {}
}

/* ── Tap dot ──────────────────────────────────────────────────── */
function showTapDot(clientX, clientY) {
  const rect = videoArea.getBoundingClientRect();
  tapDot.style.left = (clientX - rect.left) + 'px';
  tapDot.style.top  = (clientY - rect.top) + 'px';
  tapDot.style.opacity = '1';
  clearTimeout(tapDot._timer);
  tapDot._timer = setTimeout(() => { tapDot.style.opacity = '0'; }, 350);
}

/* ── Pointer Events [iOS §Touch] ──────────────────────────────── */
const pointers = new Map();
const hasCoalesced = typeof PointerEvent !== 'undefined' && 'getCoalescedEvents' in PointerEvent.prototype;
videoArea.addEventListener('pointerdown', onPointerDown, { passive: false });
videoArea.addEventListener('pointermove', onPointerMove, { passive: false });
videoArea.addEventListener('pointerup',   onPointerUp,   { passive: false });
videoArea.addEventListener('pointercancel', onPointerCancel, { passive: false });
document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });

/* Gesture model (matches iPhone Mirroring's input semantics):
   - quick tap (no move)        → control `tap`         → mouse down+up
   - swipe (move before hold)   → `scroll` packets      → scroll-wheel (the ONLY
                                                           thing Mirroring scrolls on)
   - long-press (held, still)   → control `longpress`   → mouse down (held)
   - long-press then drag       → `move` packets        → mouse-drag (slider/reorder)
   No eager `down` on every gesture: an early mouse press + drag is what Mirroring
   read as long-press/icon-reorder, so swipes never scrolled. */
function onPointerDown(e) {
  e.preventDefault();
  videoArea.setPointerCapture(e.pointerId);
  const longTimer = setTimeout(() => {
    const pd = pointers.get(e.pointerId); if (!pd) return;
    const coords = pointerToNormalized(pd.lastX, pd.lastY);
    if (coords) { sendControl({ type:'longpress', x:coords.nx, y:coords.ny }); showTapDot(pd.lastX, pd.lastY); toast('长按'); }
    pd.pressed = true; // now in mouse-drag mode (slider / icon reorder)
  }, LONGPRESS_MS);
  pointers.set(e.pointerId, { startX:e.clientX, startY:e.clientY, startT:performance.now(), lastX:e.clientX, lastY:e.clientY, longTimer, pressed:false, scrolling:false });
}
function onPointerMove(e) {
  e.preventDefault();
  const pd = pointers.get(e.pointerId); if (!pd) return;
  const events = hasCoalesced ? e.getCoalescedEvents() : [e];
  for (const ev of events) {
    const ddx = ev.clientX - pd.lastX, ddy = ev.clientY - pd.lastY; // per-move delta
    pd.lastX = ev.clientX; pd.lastY = ev.clientY;
    const moved = Math.hypot(ev.clientX - pd.startX, ev.clientY - pd.startY) > TAP_SLOP;
    const coords = pointerToNormalized(ev.clientX, ev.clientY);
    if (pd.pressed) {
      // long-press already fired → real mouse-drag (slider/reorder).
      if (coords) sendMove(coords.nx, coords.ny, 1);
    } else if (moved) {
      // swipe before any hold → scroll. Cancel the long-press timer once.
      if (!pd.scrolling) { clearTimeout(pd.longTimer); pd.scrolling = true; }
      if (coords) sendScroll(coords.nx, coords.ny, ddx, ddy);
    }
  }
}
function onPointerUp(e) {
  e.preventDefault();
  const pd = pointers.get(e.pointerId); if (!pd) return;
  clearTimeout(pd.longTimer); pointers.delete(e.pointerId);
  const coords = pointerToNormalized(e.clientX, e.clientY);
  if (pd.pressed) {
    // release the held long-press / drag.
    if (coords) sendControl({ type:'up', x:coords.nx, y:coords.ny });
  } else if (!pd.scrolling) {
    // stationary, quick → a tap.
    const dt = performance.now() - pd.startT;
    const dist = Math.hypot(e.clientX - pd.startX, e.clientY - pd.startY);
    if (coords && dist < TAP_SLOP && dt < TAP_MS) { sendControl({ type:'tap', x:coords.nx, y:coords.ny }); showTapDot(e.clientX, e.clientY); }
  }
  // swipe (scrolling) needs no release event — no mouse button was held.
}
function onPointerCancel(e) {
  const pd = pointers.get(e.pointerId); if (pd) clearTimeout(pd.longTimer);
  pointers.delete(e.pointerId);
}

/* ── Toolbar handlers (v1 parity) ─────────────────────────────── */
document.getElementById('btnHome').addEventListener('click', () => { sendControl({ type:'shortcut', name:'home' }); toast('Home'); });
document.getElementById('btnSearch').addEventListener('click', () => { sendControl({ type:'shortcut', name:'spotlight' }); toast('Spotlight'); });
document.getElementById('btnSwitcher').addEventListener('click', () => { sendControl({ type:'shortcut', name:'switcher' }); toast('切换器'); });

const btnFreeze = document.getElementById('btnFreeze');
const freezeLbl = btnFreeze.querySelector('.lbl');
btnFreeze.addEventListener('click', () => {
  frozen = !frozen;
  if (frozen) { video.pause(); btnFreeze.classList.add('active'); if (freezeLbl) freezeLbl.textContent = '继续'; toast('已冻结'); }
  else        { video.play().catch(()=>{}); btnFreeze.classList.remove('active'); if (freezeLbl) freezeLbl.textContent = '冻结'; toast('继续'); }
});

document.getElementById('btnGrid').addEventListener('click', () => {
  gridOn = !gridOn;
  gridCanvas.classList.toggle('on', gridOn);
  document.getElementById('btnGrid').classList.toggle('active', gridOn);
  drawGrid();
});

function sendText() {
  const text = textInput.value.trim().slice(0, 500);
  if (!text) return;
  sendControl({ type:'text', text });
  textInput.value = ''; toast('已输入');
}
document.getElementById('btnSend').addEventListener('click', sendText);
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

document.getElementById('btnLogout').addEventListener('click', () => { location.href = '/logout'; });

/* ── Stats: RTT from candidate-pair ───────────────────────────── */
async function pollStats() {
  if (!pc || pc.connectionState === 'closed') return;
  try {
    const stats = await pc.getStats();
    stats.forEach(report => {
      if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime != null) {
        lastRtt = Math.round(report.currentRoundTripTime * 1000);
      }
    });
  } catch (_) {}
  updateStatusLine();
}

/* ── ICE restart [SIG §restart] ───────────────────────────────── */
function scheduleIceRestart() {
  if (iceRestartTimer) return;
  iceRestartTimer = setTimeout(() => {
    iceRestartTimer = null;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    wsSend({ type:'restart' }); toast('ICE 重连中…');
  }, ICE_RESTART_DEBOUNCE_MS);
}

/* ── WebSocket helpers [SIG] ──────────────────────────────────── */
function wsSend(obj) { if (!ws || ws.readyState !== WebSocket.OPEN) return; try { ws.send(JSON.stringify(obj)); } catch (_) {} }

/* ── PeerConnection ───────────────────────────────────────────── */
async function fetchIceServers() {
  try {
    const resp = await fetch('/turn-creds', { credentials: 'include' });
    if (!resp.ok) return [];
    const data = await resp.json();
    return Array.isArray(data.iceServers) ? data.iceServers : [];
  } catch (_) { return []; }
}
async function buildPeerConnection(iceServers) {
  return new RTCPeerConnection({ iceServers, bundlePolicy:'max-bundle', rtcpMuxPolicy:'require' });
}
async function buildPeerConnectionRelayOnly(iceServers) {
  return new RTCPeerConnection({ iceServers, iceTransportPolicy:'relay', bundlePolicy:'max-bundle', rtcpMuxPolicy:'require' });
}

function wirePc(newPc) {
  if (pc) { try { pc.close(); } catch (_) {} }
  pc = newPc; controlCh = null; moveCh = null;
  pc.ontrack = (e) => { video.srcObject = e.streams[0] ?? new MediaStream([e.track]); if (!frozen) tryPlay(); };
  pc.ondatachannel = (e) => {
    const ch = e.channel; ch.binaryType = 'arraybuffer';
    if (ch.label === 'control') { controlCh = ch; ch.onopen = () => { connState = 'connected'; updateStatusLine(); }; ch.onclose = () => { controlCh = null; }; ch.onmessage = onControlMessage; }
    else if (ch.label === 'move') { moveCh = ch; ch.onclose = () => { moveCh = null; }; }
  };
  pc.onicecandidate = (e) => { if (e.candidate) wsSend({ type:'ice', candidate: e.candidate.toJSON() }); };
  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState; connState = s; updateStatusLine();
    if (s === 'disconnected' || s === 'failed') scheduleIceRestart();
    else if (s === 'connected' || s === 'completed') {
      clearTimeout(iceRestartTimer); iceRestartTimer = null;
      if (statsInterval) clearInterval(statsInterval);
      statsInterval = setInterval(pollStats, STATS_INTERVAL_MS);
    }
  };
  pc.onconnectionstatechange = () => { connState = pc.connectionState; updateStatusLine(); if (pc.connectionState === 'failed') scheduleIceRestart(); };
}

function onControlMessage(e) {
  if (typeof e.data === 'string') { try { const msg = JSON.parse(e.data); if (msg.type === 'toast') toast(msg.text || ''); } catch (_) {} }
}

/* ── Signaling loop [SIG] ─────────────────────────────────────── */
let relayAttempt = false;
async function connectWs() {
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }
  clearTimeout(iceRestartTimer); iceRestartTimer = null;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  connState = 'connecting'; updateStatusLine();
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => { connState = 'ws-open'; updateStatusLine(); reconnectDelay = RECONNECT_BASE_MS; relayAttempt = false; };
  ws.onerror = () => {};
  ws.onclose = () => {
    connState = 'ws-closed'; updateStatusLine();
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
    clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectWs, reconnectDelay);
  };
  ws.onmessage = async (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
    if (msg.type === 'offer') await handleOffer(msg.sdp);
    else if (msg.type === 'ice' && pc && msg.candidate) { try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (_) {} }
  };
}
async function handleOffer(sdp) {
  const iceServers = await fetchIceServers();
  const newPc = relayAttempt ? await buildPeerConnectionRelayOnly(iceServers) : await buildPeerConnection(iceServers);
  wirePc(newPc);
  try {
    await pc.setRemoteDescription({ type:'offer', sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    wsSend({ type:'answer', sdp: pc.localDescription.sdp });
  } catch (err) {
    connState = 'sdp-error'; updateStatusLine(); toast('SDP 协商失败');
    if (!relayAttempt) { relayAttempt = true; clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectWs, 500); }
  }
}

/* ── Chrome: text panel + immersive (mobile UI) ───────────────── */
const textPanel = document.getElementById('textPanel');
function openTextPanel() { textPanel.classList.add('open'); setTimeout(() => textInput.focus(), 60); }
function closeTextPanel() { textPanel.classList.remove('open'); textInput.blur(); }
document.getElementById('btnKeyboard').addEventListener('click', () => {
  textPanel.classList.contains('open') ? closeTextPanel() : openTextPanel();
});
document.getElementById('btnTextClose').addEventListener('click', closeTextPanel);
// close the panel right after a send (additive listeners; sendText already ran)
document.getElementById('btnSend').addEventListener('click', () => setTimeout(closeTextPanel, 40));
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') setTimeout(closeTextPanel, 40); });

const btnImmersive = document.getElementById('btnImmersive');
const grabber = document.getElementById('grabber');
const toolbar = document.getElementById('toolbar');

/* Reserve exactly the toolbar's real footprint (incl. its safe-area padding) so
   the video sits right above it — a hardcoded guess was a few px short and left
   the toolbar overlapping the phone's bottom. Immersive mode reclaims the space. */
function syncToolbarReserve() {
  const reserve = document.body.classList.contains('immersive') ? 0 : (toolbar.offsetHeight || 78);
  document.documentElement.style.setProperty('--tb-reserve', reserve + 'px');
  if (gridOn) drawGrid();
}
function setImmersive(on) {
  document.body.classList.toggle('immersive', on);
  syncToolbarReserve();
  if (gridOn) requestAnimationFrame(drawGrid);
}
btnImmersive.addEventListener('click', () => setImmersive(true));
grabber.addEventListener('click', () => setImmersive(false));
window.addEventListener('resize', syncToolbarReserve);
window.addEventListener('orientationchange', () => setTimeout(syncToolbarReserve, 200));
syncToolbarReserve();

/* ── Status pill dot colour (observe statusLine text) ─────────── */
const connDot = document.querySelector('#statusPill .conn-dot');
function paintDot() {
  const t = statusLine.textContent || '';
  connDot.className = 'conn-dot ' + (/(connected|completed)/.test(t) ? 'ok' : /(failed|closed|error)/.test(t) ? 'bad' : 'warn');
}
new MutationObserver(paintDot).observe(statusLine, { childList:true, characterData:true, subtree:true });

/* ── Boot ─────────────────────────────────────────────────────── */
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
video.addEventListener('pause', () => { if (!frozen) playOverlay.classList.remove('hidden'); });
video.addEventListener('playing', () => { playOverlay.classList.add('hidden'); });
video.addEventListener('stalled', tryPlay);
video.addEventListener('waiting', tryPlay);
paintDot();
connectWs();
</script>
