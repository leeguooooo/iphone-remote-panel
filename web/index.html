<!doctype html>
<!--
  iphone-use — WebRTC web client  (web/index.html)
  =====================================================
  Served at /phone (auth-gated).  Daemon is the OFFERER.
  Signaling:  WebSocket /ws
  ICE creds:  GET /turn-creds  → {iceServers:[...]}
  Video:      recvonly track, ondatachannel for "control" (reliable) + "move" (lossy)
  Touch:      Pointer Events → normalized [0,1] content-rect coords

  Mobile UI: video is the hero (full-bleed). Chrome is a thumb-zone bottom toolbar +
  floating status pill + slide-up text panel + immersive collapse. Instrument-panel
  aesthetic: dark, monospace readouts, accent-glow active states. Safe-area aware.
  Ref:
    docs/superpowers/notes/2026-06-09-ios-safari-webrtc-client.md
    docs/superpowers/notes/2026-06-09-v1-feature-parity.md
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- [iOS-notes §Fullscreen/PWA] viewport-fit=cover for safe-area; initial-scale=1 required -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- [iOS-notes §Fullscreen/PWA] standalone PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08090c" />
  <title>iphone-use</title>
  <style>
    /* ── Design system: instrument-panel dark ────────────────────── */
    :root {
      color-scheme: dark;
      --bg:      #08090c;
      --panel:   #11131a;
      --panel-2: #161922;
      --line:    #272b38;
      --text:    #eef2ff;
      --muted:   #8b93a7;
      --accent:  #4f8cff;
      --accent-dim: #1a2a4a;
      --ok:      #4ade80;
      --warn:    #facc15;
      --danger:  #ff5a66;
      --danger-bg:  #2a1116;
      --danger-border: #5b1b24;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      --tb-h: 64px;                 /* toolbar height (content) */
      /* Space the video must leave at the bottom so the floating toolbar never
         covers the phone screen. Immersive mode (toolbar hidden) reclaims it. */
      --tb-reserve: calc(var(--tb-h) + env(safe-area-inset-bottom) + 14px);
    }
    /* --tb-reserve is corrected to the toolbar's real measured height by
       syncToolbarReserve() (and set to 0 in immersive mode); the calc above is
       just a first-paint fallback. */
    *, *::before, *::after { box-sizing: border-box; }

    /* [iOS-notes §Touch] suppress scroll/zoom/callout on html+body */
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ── App shell: video fills, toolbar floats over the bottom ───── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;               /* [iOS-notes] 100dvh not 100vh */
    }

    /* ── Video area: full-bleed hero ─────────────────────────────── */
    #videoArea {
      flex: 1 1 0;
      position: relative;
      background:
        radial-gradient(120% 80% at 50% 0%, #0c0e14 0%, #050608 70%);
      overflow: hidden;
      /* [iOS-notes §Touch] */
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }

    /* [iOS-notes §Video] The video sits ABOVE the floating toolbar so the toolbar
       never covers the phone's bottom (and taps there don't hit the toolbar).
       Use an explicit HEIGHT, not `bottom`: <video> is a replaced element, and
       width:100% + its intrinsic aspect ratio would otherwise drive the height
       past `bottom` and back behind the toolbar. getBoundingClientRect() then
       yields the visible rect, so the content-rect / coordinate math stays correct. */
    #screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: calc(100% - var(--tb-reserve));
      object-fit: contain;          /* letterbox; required for content-rect math */
      background: #000;
      pointer-events: none;         /* pointer events handled on #videoArea */
      touch-action: none;
      transition: height .28s cubic-bezier(.2,.7,.2,1);
    }
    /* subtle device-screen vignette + inset ring so the mirror reads as "a screen" */
    #videoArea::after {
      content: ""; position: absolute;
      top: 0; left: 0; width: 100%;
      height: calc(100% - var(--tb-reserve)); pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03),
                  inset 0 30px 60px -30px rgba(0,0,0,.5);
      transition: height .28s cubic-bezier(.2,.7,.2,1);
    }

    #gridCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: calc(100% - var(--tb-reserve));
      pointer-events: none; display: none;
      transition: height .28s cubic-bezier(.2,.7,.2,1);
    }
    #gridCanvas.on { display: block; }

    /* Tap dot (v1: 350ms fade) */
    #tapDot {
      position: absolute; width: 30px; height: 30px;
      border: 2px solid #fff; background: rgba(79,140,255,.35);
      border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 5;
      box-shadow: 0 0 16px 2px rgba(79,140,255,.5);
    }

    /* ── Floating status pill (top, under notch) ─────────────────── */
    #statusPill {
      position: absolute; z-index: 8;
      top: calc(env(safe-area-inset-top) + 10px);
      left: calc(env(safe-area-inset-left) + 12px);
      display: flex; align-items: center; gap: 7px;
      padding: 6px 11px;
      background: rgba(10,12,18,.62);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 999px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      max-width: min(70vw, 320px);
    }
    #statusPill .conn-dot { font-size: 9px; line-height: 1; color: var(--warn); transition: color .3s; }
    #statusPill .conn-dot.ok  { color: var(--ok); filter: drop-shadow(0 0 4px rgba(74,222,128,.7)); }
    #statusPill .conn-dot.warn{ color: var(--warn); }
    #statusPill .conn-dot.bad { color: var(--danger); }
    #statusLine {
      font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
      color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── "Tap to start" play overlay ─────────────────────────────── */
    #playOverlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: rgba(6,7,11,.86);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      cursor: pointer;
    }
    #playOverlay .pulse {
      width: 92px; height: 92px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(79,140,255,.12);
      border: 1px solid rgba(79,140,255,.4);
      box-shadow: 0 0 0 0 rgba(79,140,255,.4);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(79,140,255,.35); }
      70%  { box-shadow: 0 0 0 22px rgba(79,140,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,140,255,0); }
    }
    #playOverlay svg { width: 40px; height: 40px; fill: var(--accent); margin-left: 4px; }
    #playOverlay p { color: var(--text); font-size: 15px; margin: 0; letter-spacing: .04em; }
    #playOverlay.hidden { display: none; }

    /* ── Bottom toolbar (thumb zone) ─────────────────────────────── */
    #toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; gap: 4px; align-items: stretch;
      padding: 8px calc(env(safe-area-inset-left) + 8px)
               calc(env(safe-area-inset-bottom) + 8px)
               calc(env(safe-area-inset-right) + 8px);
      background: linear-gradient(to top, rgba(8,9,12,.96), rgba(8,9,12,.82));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      transition: transform .28s cubic-bezier(.2,.7,.2,1), opacity .2s;
    }
    #toolbar::-webkit-scrollbar { display: none; }
    body.immersive #toolbar { transform: translateY(120%); opacity: 0; pointer-events: none; }

    .tbtn {
      flex: 1 0 auto; min-width: 52px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 8px; min-height: 48px;
      background: transparent; border: 1px solid transparent; border-radius: 12px;
      color: var(--muted); font-family: var(--sans); cursor: pointer;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tbtn:active { background: var(--panel-2); }
    .tbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tbtn .lbl { font-size: 10px; line-height: 1; letter-spacing: .02em; white-space: nowrap; }
    .tbtn.active {
      color: var(--accent); background: var(--accent-dim);
      border-color: rgba(79,140,255,.35);
      box-shadow: 0 0 14px -4px rgba(79,140,255,.6);
    }
    .tbtn.danger { color: #ff8a93; }
    .tbtn.danger:active { background: var(--danger-bg); }
    .tbtn.spacer { flex: 1 1 auto; min-width: 4px; pointer-events: none; }

    /* freeze: swap icon by .active (the JS only toggles .active + .lbl text) */
    .tbtn .ico-play { display: none; }
    .tbtn.active .ico-pause { display: none; }
    .tbtn.active .ico-play { display: inline; }

    /* ── Grabber to restore chrome when immersive ────────────────── */
    #grabber {
      position: fixed; z-index: 29; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      width: 64px; height: 26px; border-radius: 999px;
      background: rgba(10,12,18,.7); border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #grabber::before { content: ""; width: 30px; height: 4px; border-radius: 2px; background: var(--muted); }
    body.immersive #grabber { display: flex; }

    /* ── Slide-up text panel ─────────────────────────────────────── */
    #textPanel {
      position: fixed; left: 0; right: 0; z-index: 40;
      bottom: calc(var(--tb-h) + env(safe-area-inset-bottom) + 8px);
      display: flex; gap: 8px; align-items: center;
      padding: 10px calc(env(safe-area-inset-left) + 12px) 10px calc(env(safe-area-inset-right) + 12px);
      background: rgba(14,16,22,.98);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      transform: translateY(160%); opacity: 0; pointer-events: none;
      transition: transform .26s cubic-bezier(.2,.7,.2,1), opacity .2s;
    }
    #textPanel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #textInput {
      flex: 1 1 auto; min-width: 0;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font-size: 16px;     /* 16px avoids iOS focus-zoom */
      font-family: var(--sans); -webkit-appearance: none;
    }
    #textInput:focus { outline: none; border-color: var(--accent); }
    #btnSend {
      flex: 0 0 auto; background: var(--accent); border: 1px solid var(--accent);
      color: #fff; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; -webkit-appearance: none;
    }
    #btnTextClose {
      flex: 0 0 auto; background: transparent; border: 1px solid var(--line);
      color: var(--muted); border-radius: 12px; padding: 12px 12px; font-size: 14px; cursor: pointer;
    }

    /* ── L2 stills fallback (Mirroring gone but WDA alive) ───────── */
    #stillFrame {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      display: none;
      pointer-events: none;   /* taps still land on #videoArea */
    }
    #stillFrame.active { display: block; }

    /* ── Update banner (new release available) ───────────────────── */
    #updateBanner {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      display: none; align-items: center; gap: .5rem;
      background: rgba(20, 24, 38, .92); border: 1px solid rgba(99,102,241,.5);
      color: #c7d2fe; font-size: 12px; padding: .35rem .8rem; border-radius: 99px;
      z-index: 30; backdrop-filter: blur(6px); cursor: default;
    }
    #updateBanner.visible { display: flex; }
    #updateBanner code { font-size: 11px; background: rgba(99,102,241,.18); padding: .1em .4em; border-radius: 4px; }
    #updateBanner .x { cursor: pointer; opacity: .6; padding: 0 .2rem; }
    #updateBanner .x:hover { opacity: 1; }

    /* ── Offline / stall overlay ────────────────────────────────── */
    #offlineOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: calc(100% - var(--tb-reserve));
      z-index: 15;                /* above video (z=0) and tapDot (z=5), below playOverlay (z=20) */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px;
      background: rgba(8,9,12,.72);
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      pointer-events: none;       /* taps pass through to #videoArea so a tap can wake Mirroring */
      transition: opacity .3s, height .28s cubic-bezier(.2,.7,.2,1);
      opacity: 0;
    }
    #offlineOverlay.visible { opacity: 1; }
    #reconnectBtn {
      margin-top: 14px; padding: .5rem 1.3rem; border-radius: 99px; cursor: pointer;
      border: 1px solid rgba(99,102,241,.55); background: rgba(99,102,241,.18);
      color: #c7d2fe; font-size: 13px; pointer-events: auto; transition: background .15s;
    }
    #reconnectBtn:hover { background: rgba(99,102,241,.32); }
    #reconnectBtn:disabled { opacity: .5; cursor: default; }
    #offlineOverlay .ol-icon  { font-size: 36px; line-height: 1; }
    #offlineOverlay .ol-title {
      font-family: var(--sans); font-size: 16px; font-weight: 600;
      color: var(--text); letter-spacing: .02em;
    }
    #offlineOverlay .ol-sub {
      font-family: var(--sans); font-size: 12px;
      color: var(--muted); letter-spacing: .02em;
      max-width: 260px; text-align: center; line-height: 1.5;
    }
    /* Pulsing dot — instrument-panel style */
    #offlineOverlay .ol-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 0 rgba(250,204,21,.5);
      animation: ol-pulse 2s infinite;
    }
    #offlineOverlay.disconnected .ol-pulse {
      background: var(--danger);
      box-shadow: 0 0 0 0 rgba(255,90,102,.5);
      animation: ol-pulse-red 2s infinite;
    }
    @keyframes ol-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(250,204,21,.55); }
      60%  { box-shadow: 0 0 0 9px rgba(250,204,21,0); }
      100% { box-shadow: 0 0 0 0 rgba(250,204,21,0); }
    }
    @keyframes ol-pulse-red {
      0%   { box-shadow: 0 0 0 0 rgba(255,90,102,.55); }
      60%  { box-shadow: 0 0 0 9px rgba(255,90,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,90,102,0); }
    }

    /* ── Toast (v1: 1600ms) ─────────────────────────────────────── */
    #toast {
      position: fixed; left: 50%;
      bottom: calc(var(--tb-h) + env(safe-area-inset-bottom) + 24px);
      transform: translateX(-50%) translateY(8px);
      background: rgba(17,24,39,.96); border: 1px solid var(--line);
      color: var(--text); padding: 9px 15px; border-radius: 12px; font-size: 13px;
      opacity: 0; transition: opacity .2s, transform .2s; z-index: 99;
      max-width: 86vw; pointer-events: none; text-align: center;
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">
  <!-- ── Video + interaction surface (hero) ────────────────────── -->
  <div id="videoArea">
    <video id="screen" autoplay playsinline webkit-playsinline muted
           disablePictureInPicture disableRemotePlayback></video>
    <!-- L2 stills fallback: shown when the Mirroring window is gone but the
         daemon can still capture via WDA (GET /agent/screenshot, cookie-authed) -->
    <img id="stillFrame" alt="">
    <canvas id="gridCanvas"></canvas>
    <div id="tapDot"></div>

    <!-- update-available banner (populated from /agent/status) -->
    <div id="updateBanner" role="status">
      <span id="updateText"></span>
      <span class="x" id="updateDismiss" title="本次会话不再提示">✕</span>
    </div>

    <!-- offline / stall overlay (pointer-events:none so taps still reach videoArea) -->
    <div id="offlineOverlay" aria-live="polite" aria-atomic="true">
      <div class="ol-pulse"></div>
      <div class="ol-icon">📵</div>
      <div class="ol-title" id="olTitle">画面已停止</div>
      <div class="ol-sub"  id="olSub">手机可能已锁屏、断开或镜像已暂停</div>
      <button id="reconnectBtn" type="button">重新连接</button>
    </div>

    <!-- floating status pill -->
    <div id="statusPill">
      <span class="conn-dot">&#9679;</span>
      <span id="statusLine">connecting…</span>
    </div>

    <!-- [iOS-notes §Video] "Tap to start" play() gesture fallback -->
    <div id="playOverlay">
      <span class="pulse">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7L8 5z"/></svg>
      </span>
      <p>轻触以开始</p>
    </div>
  </div>
</div><!-- #app -->

<!-- ── Bottom toolbar (thumb zone, v1 parity + WebRTC affordances) ── -->
<nav id="toolbar" aria-label="控制栏">
  <button id="btnHome" class="tbtn" title="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span class="lbl">Home</span>
  </button>
  <button id="btnSearch" class="tbtn" title="Spotlight 搜索">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <span class="lbl">搜索</span>
  </button>
  <button id="btnSwitcher" class="tbtn" title="App 切换">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
    <span class="lbl">切换器</span>
  </button>
  <button id="btnGrid" class="tbtn" title="数字网格覆盖">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
    <span class="lbl">网格</span>
  </button>
  <button id="btnFreeze" class="tbtn" title="暂停/继续渲染">
    <svg class="ico-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
    <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z" fill="currentColor" stroke="none"/></svg>
    <span class="lbl">冻结</span>
  </button>
  <button id="btnKeyboard" class="tbtn" title="文字输入">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M6 14h0M18 14h0M9 14h6"/></svg>
    <span class="lbl">键盘</span>
  </button>
  <button id="btnLogout" class="tbtn danger" title="退出">
    <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>
    <span class="lbl">退出</span>
  </button>
  <span class="tbtn spacer" aria-hidden="true"></span>
  <button id="btnImmersive" class="tbtn" title="全屏（收起控制栏）">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M3 16v3a2 2 0 002 2h3"/></svg>
    <span class="lbl">全屏</span>
  </button>
</nav>

<!-- restore handle when immersive -->
<button id="grabber" aria-label="显示控制栏"></button>

<!-- slide-up text panel (opened by 键盘) -->
<div id="textPanel">
  <input id="textInput" type="text" placeholder="输入到手机…" maxlength="500"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" />
  <button id="btnSend" class="primary">发送</button>
  <button id="btnTextClose">关闭</button>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   iphone-use — WebRTC client
   Contract legend:
     [SIG] signaling (/ws)  [ICE] /turn-creds + ICE  [CH] data channels
     [TOUCH] Pointer Events  [iOS] Safari notes  [v1] parity affordance
   ================================================================ */
'use strict';

/* ── URL flags ────────────────────────────────────────────────── */
/* ?relay=1  →  force iceTransportPolicy:'relay' (TURN-only, no direct/srflx).
   Use this from a LAN browser to exercise the Cloudflare TURN path without
   leaving the network.  See GitHub issue #9. */
const FORCE_RELAY = new URLSearchParams(location.search).has('relay');

/* ── Constants ────────────────────────────────────────────────── */
const TAP_MS       = 250;
const TAP_SLOP     = 10;
const LONGPRESS_MS = 500;
const MOVE_BACKPRESSURE_BYTES = 256 * 1024;
const STATS_INTERVAL_MS = 2000;
const ICE_RESTART_DEBOUNCE_MS = 2000;
const RECONNECT_BASE_MS = 1500;

/* ── DOM refs ─────────────────────────────────────────────────── */
const video          = document.getElementById('screen');
const videoArea      = document.getElementById('videoArea');
const gridCanvas     = document.getElementById('gridCanvas');
const tapDot         = document.getElementById('tapDot');
const playOverlay    = document.getElementById('playOverlay');
const statusLine     = document.getElementById('statusLine');
const toastEl        = document.getElementById('toast');
const textInput      = document.getElementById('textInput');
const offlineOverlay = document.getElementById('offlineOverlay');
const reconnectBtn = document.getElementById('reconnectBtn');
if (reconnectBtn) reconnectBtn.onclick = async () => {
  reconnectBtn.disabled = true;
  const orig = reconnectBtn.textContent;
  reconnectBtn.textContent = '连接中…';
  try {
    // When the phone was idle-released (handed back to its owner), reconnect
    // means "take the phone back" → restart WDA (mode=agent). Otherwise it's a
    // stalled mirror: mode=mirror runs the full server-side recovery (lock
    // phone, stop any WDA, bring Mirroring frontmost, tap Try Again).
    const mode = (overlayState === 'released') ? 'agent' : 'mirror';
    await fetch('/agent/mode', {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    });
  } catch (_) { /* best-effort */ }
  setTimeout(() => { reconnectBtn.disabled = false; reconnectBtn.textContent = orig; }, 12000);
};
const olTitle        = document.getElementById('olTitle');
const olSub          = document.getElementById('olSub');

/* ── Stall detection constants ────────────────────────────────── */
const STALL_THRESHOLD_MS  = 4000;   /* no new frame for >4 s → stalled */
const STALL_POLL_INTERVAL = 1000;   /* fallback poll (when rVFC unavailable) */

/* ── State ────────────────────────────────────────────────────── */
let pc = null, ws = null, controlCh = null, moveCh = null;
let frozen = false, gridOn = false, wakeLock = null;
let iceRestartTimer = null, reconnectTimer = null;
let reconnectDelay = RECONNECT_BASE_MS, statsInterval = null;
let lastRtt = '--', connState = 'new';
let agentMode = false; // true when the daemon reports mode=agent (WDA on-device drive + MJPEG video)

/* ── Overlay state: 'hidden' | 'stalled' | 'disconnected' ────── */
let overlayState = 'hidden';
let queuedAhead = 0; /* issue #8: viewers ahead of us in the single-viewer queue */

/* ── Toast ────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1600);
}

/* ── Offline overlay management ──────────────────────────────── */
function showOverlay(kind) {
  /* kind: 'stalled' | 'disconnected' | 'gone'
     'gone' = daemon-reported: the Mirroring window vanished (phone fully
     disconnected / Mirroring quit). The daemon's keepalive keeps frames
     flowing, so only the phone_status signal can tell us this. */
  if (overlayState === kind) return;
  overlayState = kind;
  offlineOverlay.classList.remove('disconnected');
  if (kind === 'disconnected') {
    olTitle.textContent = '连接已断开';
    olSub.textContent   = '正在尝试重连…';
    offlineOverlay.classList.add('disconnected');
  } else if (kind === 'gone') {
    olTitle.textContent = '手机已断开';
    olSub.textContent   = 'iPhone 镜像窗口已消失 — 检查手机与 Mac 的连接';
    offlineOverlay.classList.add('disconnected');
  } else if (kind === 'queued') {
    /* issue #8: another viewer holds the live session — we wait in line and the
       daemon promotes us (sends an offer) when they disconnect. */
    olTitle.textContent = '会话占用中';
    olSub.textContent   = (queuedAhead > 1)
      ? `另一个观看者正在使用 — 已排队(前面还有 ${queuedAhead} 位)，对方断开后自动接入`
      : '另一个观看者正在使用 — 已排队，对方断开后将自动接入';
    offlineOverlay.classList.add('disconnected');
  } else if (kind === 'released') {
    /* idle auto-release: the daemon stopped WDA after a stretch of no remote
       activity so the phone is free for hands-on use. Not an error — offer to
       take it back. The reconnect button posts mode=agent in this state. */
    olTitle.textContent = '手机已交还给你';
    olSub.textContent   = '一段时间无远程操作，已自动把手机交还，你可正常使用。需要远程控制时点「重新连接」(约 30-90 秒重启 WDA)';
    offlineOverlay.classList.add('disconnected');
  } else if (kind === 'locked') {
    /* agent/WDA mode: WDA answers /status but isn't actionable (phone locked or
       the XCUITest session went zombie), so its MJPEG is dead/stale. Tell the
       user instead of showing a silent black screen. The daemon's WDA keepalive
       recovers on its own once the phone is unlocked + awake. */
    olTitle.textContent = '手机不可用';
    olSub.textContent   = '手机已锁屏或会话失效 — 请解锁手机并保持唤醒(建议把自动锁定设为「永不」)';
    offlineOverlay.classList.add('disconnected');
  } else {
    olTitle.textContent = '画面已停止';
    olSub.textContent   = '手机可能已锁屏、断开或镜像已暂停';
  }
  offlineOverlay.classList.add('visible');
  paintDot();
}
/* ── Update check (once per page load) ───────────────────────────
   /agent/status accepts the session cookie; the daemon refreshes its view of
   the latest GitHub release daily. Show a dismissible pill when behind. */
(async () => {
  try {
    const r = await fetch('/agent/status', { cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    if (s.update_available && s.latest && !sessionStorage.getItem('updateDismissed')) {
      document.getElementById('updateText').innerHTML =
        `新版本 <b>${s.latest}</b> 可用(当前 v${s.version})— 升级:<code>curl -fsSL https://raw.githubusercontent.com/leeguooooo/iphone-use/main/install.sh | sh</code>`;
      document.getElementById('updateBanner').classList.add('visible');
      document.getElementById('updateDismiss').onclick = () => {
        sessionStorage.setItem('updateDismissed', '1');
        document.getElementById('updateBanner').classList.remove('visible');
      };
    }
  } catch (_) { /* best-effort */ }
})();

/* ── Agent-mode video source ─────────────────────────────────────
   When WDA drives the phone (mode=agent), the WebRTC video track is the Mac's
   iPhone-Mirroring capture — which is a DIFFERENT device than WDA's target (or a
   stale frame), so it must NOT be shown. Force the live MJPEG of the actual WDA
   target on top instead. Mirror mode keeps the WebRTC video. Poll cheaply; the
   startStills/stopStills calls are idempotent. */
async function pollAgentMode() {
  try {
    const r = await fetch('/agent/status', { cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    agentMode = (s.mode === 'agent');
    if (s.released === true) {
      // Idle auto-release takes priority over mode rendering: WDA is stopped on
      // purpose so the owner can use the phone. Show the reconnect affordance.
      stopStills();
      playOverlay.classList.add('hidden');
      showOverlay('released');
      return;
    } else if (overlayState === 'released') {
      hideOverlay();   // taken back → drop the released overlay
    }
    if (agentMode) {
      startStills();                          // MJPEG (WDA device) overlays the WebRTC track
      // The MJPEG <img> needs no autoplay gesture, and it's per-viewer (independent
      // of the WebRTC single-viewer lease). So the "轻触以开始" play gesture and the
      // "会话占用中"(queued)/mirror-gone overlays would all wrongly block a live picture.
      playOverlay.classList.add('hidden');
      if (s.wda_actionable === false) {
        // WDA up but not actionable (phone locked / zombie session) → MJPEG is
        // dead/stale. Show an informative overlay instead of a silent black screen.
        showOverlay('locked');
      } else if (overlayState === 'locked' || overlayState === 'gone' || overlayState === 'queued') {
        hideOverlay();                        // recovered → drop the stale overlay
      }
    } else {
      stopStills();                           // mirror mode → show the WebRTC video
    }
  } catch (_) { /* best-effort */ }
}
pollAgentMode();
setInterval(pollAgentMode, 3000);

/* ── L2 stills fallback ──────────────────────────────────────────
   When Mirroring dies (phone in use / disconnected) the WebRTC track has no
   real pixels, but the daemon's /agent/screenshot can still capture via WDA
   on the phone. Poll it as stills so the page never goes blank. The endpoint
   accepts the login session cookie, so no extra credential is needed. */
const stillFrame = document.getElementById('stillFrame');
let stillsTimer = null, stillsUrl = null, stillsBusy = false, mjpegLive = false;
async function fetchStill() {
  if (stillsBusy) return;
  stillsBusy = true;
  try {
    const r = await fetch('/agent/screenshot?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const blob = await r.blob();
      const next = URL.createObjectURL(blob);
      stillFrame.src = next;
      if (stillsUrl) URL.revokeObjectURL(stillsUrl);
      stillsUrl = next;
      stillFrame.classList.add('active');
      olSub.textContent = '镜像离线 — 静帧模式(每 2.5 秒刷新,仍可点按操作)';
    }
  } catch (_) { /* offline poll is best-effort */ }
  stillsBusy = false;
}
/* Mirror is offline (agent/WDA mode). Prefer the LIVE MJPEG stream — WDA serves
   it on-device in the same XCUITest session as control, so it coexists with
   driving (Mirroring can't). The browser renders multipart/x-mixed-replace
   directly in the <img> at ~28fps; the session cookie rides along automatically.
   If MJPEG is unavailable (no relay / no WDA), fall back to 2.5s screenshots. */
function startStills() {
  if (mjpegLive || stillsTimer) return;
  mjpegLive = true;
  stillFrame.onerror = () => {
    if (!mjpegLive) return;          // already torn down
    mjpegLive = false;
    stillFrame.onerror = null;
    if (!stillsTimer) { fetchStill(); stillsTimer = setInterval(fetchStill, 2500); }
  };
  stillFrame.src = '/agent/mjpeg?t=' + Date.now();
  stillFrame.classList.add('active');
  olSub.textContent = '镜像离线 — 实时画面(WDA 设备端,可点按操作)';
}
function stopStills() {
  mjpegLive = false;
  stillFrame.onerror = null;
  if (stillsTimer) { clearInterval(stillsTimer); stillsTimer = null; }
  stillFrame.src = '';               // close the MJPEG connection / drop the still
  stillFrame.classList.remove('active');
}

function hideOverlay() {
  if (overlayState === 'hidden') return;
  overlayState = 'hidden';
  offlineOverlay.classList.remove('visible', 'disconnected');
  paintDot();
}

/* ── Wake Lock [iOS §Wake Lock] ───────────────────────────────── */
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    if (wakeLock && !wakeLock.released) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (_) {}
}

/* ── Play() with fallback overlay [iOS §Video] ────────────────── */
async function tryPlay() {
  if (video.srcObject == null) return;
  try { await video.play(); playOverlay.classList.add('hidden'); acquireWakeLock(); }
  catch (_) { playOverlay.classList.remove('hidden'); }
}
playOverlay.addEventListener('pointerup', async (e) => {
  e.stopPropagation();
  try { await video.play(); playOverlay.classList.add('hidden'); acquireWakeLock(); } catch (_) {}
});

/* ── Visibility change: re-play + WakeLock + ICE restart [iOS] ── */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (video.srcObject && video.paused && !frozen) tryPlay();
    acquireWakeLock();
    if (pc && (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed')) scheduleIceRestart();
  }
});

/* ── Grid overlay (v1: 12×24, numbered 1–288) ─────────────────── */
function drawGrid() {
  if (!gridOn) return;
  // Measure the canvas's own box (it sits above the toolbar via CSS --tb-reserve),
  // not the full videoArea — keeps the grid aligned with the visible video.
  const rect = gridCanvas.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  gridCanvas.width  = Math.round(rect.width  * dpr);
  gridCanvas.height = Math.round(rect.height * dpr);
  const ctx = gridCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  const COLS = 12, ROWS = 24;
  ctx.strokeStyle = 'rgba(255,60,60,.55)'; ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { const x = rect.width * c / COLS; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,rect.height); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { const y = rect.height * r / ROWS; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(rect.width,y); ctx.stroke(); }
  ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = 'rgba(255,80,80,.9)'; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
  let n = 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = rect.width*c/COLS + 3, y = rect.height*r/ROWS + 12;
    ctx.strokeText(String(n), x, y); ctx.fillText(String(n), x, y); n++;
  }
}
window.addEventListener('resize', () => { if (gridOn) drawGrid(); });

/* ── Content-rect coord mapping [iOS §Touch] ──────────────────── */
function pointerToNormalized(clientX, clientY) {
  // Map against whichever source is actually on screen: the live MJPEG still
  // (agent/WDA mode — the real target phone) or the WebRTC video (mirror mode).
  // In agent mode the WebRTC track is the Mac's mirror — a DIFFERENT device — so
  // its size/letterboxing would map taps to the wrong place.
  const usingStill = mjpegLive && stillFrame.classList.contains('active');
  const el = usingStill ? stillFrame : video;
  const rect = el.getBoundingClientRect();
  const vw = usingStill ? el.naturalWidth  : el.videoWidth;
  const vh = usingStill ? el.naturalHeight : el.videoHeight;
  if (!vw || !vh) return null;
  const elAR = rect.width / rect.height, vidAR = vw / vh;
  let contentW, contentH, offX, offY;
  if (elAR >= vidAR) { contentH = rect.height; contentW = rect.height * vidAR; offX = rect.left + (rect.width - contentW)/2; offY = rect.top; }
  else               { contentW = rect.width;  contentH = rect.width / vidAR;  offX = rect.left; offY = rect.top + (rect.height - contentH)/2; }
  const nx = (clientX - offX) / contentW, ny = (clientY - offY) / contentH;
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return null;
  return { nx, ny };
}

/* ── Control / move channels [CH] ─────────────────────────────── */
function sendControl(obj) {
  if (!controlCh || controlCh.readyState !== 'open') return;
  try { controlCh.send(JSON.stringify(obj)); } catch (_) {}
}
function sendMove(nx, ny, flags) {
  if (!moveCh || moveCh.readyState !== 'open') return;
  if (moveCh.bufferedAmount > MOVE_BACKPRESSURE_BYTES) return;
  const buf = new ArrayBuffer(5), view = new DataView(buf);
  view.setUint16(0, Math.round(nx * 65535), false);
  view.setUint16(2, Math.round(ny * 65535), false);
  view.setUint8(4, flags & 0xff);
  try { moveCh.send(buf); } catch (_) {}
}
/* Swipe → scroll-wheel. 7-byte packet: [u16 nx][u16 ny][i8 dx][i8 dy][u8 flags=0x02].
   nx/ny anchor the cursor; dx/dy are per-move CSS-pixel deltas. iPhone Mirroring
   only scrolls on scroll-wheel events, so swipes go here (NOT sendMove, which is a
   mouse-drag → long-press/reorder and never scrolls). */
const clampI8 = v => Math.max(-127, Math.min(127, Math.round(v)));
function sendScroll(nx, ny, dx, dy) {
  if (!moveCh || moveCh.readyState !== 'open') return;
  if (moveCh.bufferedAmount > MOVE_BACKPRESSURE_BYTES) return;
  const buf = new ArrayBuffer(7), view = new DataView(buf);
  view.setUint16(0, Math.round(nx * 65535), false);
  view.setUint16(2, Math.round(ny * 65535), false);
  view.setInt8(4, clampI8(dx));
  view.setInt8(5, clampI8(dy));
  view.setUint8(6, 0x02);
  try { moveCh.send(buf); } catch (_) {}
}

/* ── Tap dot ──────────────────────────────────────────────────── */
function showTapDot(clientX, clientY) {
  const rect = videoArea.getBoundingClientRect();
  tapDot.style.left = (clientX - rect.left) + 'px';
  tapDot.style.top  = (clientY - rect.top) + 'px';
  tapDot.style.opacity = '1';
  clearTimeout(tapDot._timer);
  tapDot._timer = setTimeout(() => { tapDot.style.opacity = '0'; }, 350);
}

/* ── Pointer Events [iOS §Touch] ──────────────────────────────── */
const pointers = new Map();
const hasCoalesced = typeof PointerEvent !== 'undefined' && 'getCoalescedEvents' in PointerEvent.prototype;
videoArea.addEventListener('pointerdown', onPointerDown, { passive: false });
videoArea.addEventListener('pointermove', onPointerMove, { passive: false });
videoArea.addEventListener('pointerup',   onPointerUp,   { passive: false });
videoArea.addEventListener('pointercancel', onPointerCancel, { passive: false });
document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
document.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });

/* Gesture model (matches iPhone Mirroring's input semantics):
   - quick tap (no move)        → control `tap`         → mouse down+up
   - swipe (move before hold)   → `scroll` packets      → scroll-wheel (the ONLY
                                                           thing Mirroring scrolls on)
   - long-press (held, still)   → control `longpress`   → mouse down (held)
   - long-press then drag       → `move` packets        → mouse-drag (slider/reorder)
   No eager `down` on every gesture: an early mouse press + drag is what Mirroring
   read as long-press/icon-reorder, so swipes never scrolled. */
function onPointerDown(e) {
  e.preventDefault();
  videoArea.setPointerCapture(e.pointerId);
  const longTimer = setTimeout(() => {
    const pd = pointers.get(e.pointerId); if (!pd) return;
    const coords = pointerToNormalized(pd.lastX, pd.lastY);
    if (coords) { sendControl({ type:'longpress', x:coords.nx, y:coords.ny }); showTapDot(pd.lastX, pd.lastY); toast('长按'); }
    pd.pressed = true; // now in mouse-drag mode (slider / icon reorder)
  }, LONGPRESS_MS);
  pointers.set(e.pointerId, { startX:e.clientX, startY:e.clientY, startT:performance.now(), lastX:e.clientX, lastY:e.clientY, longTimer, pressed:false, scrolling:false });
}
function onPointerMove(e) {
  e.preventDefault();
  const pd = pointers.get(e.pointerId); if (!pd) return;
  const events = hasCoalesced ? e.getCoalescedEvents() : [e];
  for (const ev of events) {
    const ddx = ev.clientX - pd.lastX, ddy = ev.clientY - pd.lastY; // per-move delta
    pd.lastX = ev.clientX; pd.lastY = ev.clientY;
    const moved = Math.hypot(ev.clientX - pd.startX, ev.clientY - pd.startY) > TAP_SLOP;
    const coords = pointerToNormalized(ev.clientX, ev.clientY);
    if (pd.pressed) {
      // long-press already fired → real mouse-drag (slider/reorder).
      if (coords) sendMove(coords.nx, coords.ny, 1);
    } else if (moved) {
      // swipe before any hold. Cancel the long-press timer once.
      if (!pd.scrolling) { clearTimeout(pd.longTimer); pd.scrolling = true; }
      // Mirror mode: stream scroll-wheel deltas (the only thing Mirroring scrolls
      // on). Agent/WDA mode has NO scroll-wheel — a per-move delta stream becomes a
      // storm of discrete on-device swipes that keep scrolling after release, so
      // there we accumulate and fire ONE swipe (start→end) on pointer-up instead.
      if (!agentMode && coords) sendScroll(coords.nx, coords.ny, ddx, ddy);
    }
  }
}
function onPointerUp(e) {
  e.preventDefault();
  const pd = pointers.get(e.pointerId); if (!pd) return;
  clearTimeout(pd.longTimer); pointers.delete(e.pointerId);
  const coords = pointerToNormalized(e.clientX, e.clientY);
  if (pd.pressed) {
    // release the held long-press / drag.
    if (coords) sendControl({ type:'up', x:coords.nx, y:coords.ny });
  } else if (pd.scrolling) {
    // swipe released. Mirror mode already scrolled per-move (scroll-wheel) — nothing
    // to do. Agent/WDA mode: emit the whole gesture as ONE on-device drag (start→end).
    if (agentMode) {
      const a = pointerToNormalized(pd.startX, pd.startY);
      const b = pointerToNormalized(e.clientX, e.clientY);
      if (a && b) sendControl({ type:'swipe', x1:a.nx, y1:a.ny, x2:b.nx, y2:b.ny });
    }
  } else {
    // stationary, quick → a tap.
    const dt = performance.now() - pd.startT;
    const dist = Math.hypot(e.clientX - pd.startX, e.clientY - pd.startY);
    if (coords && dist < TAP_SLOP && dt < TAP_MS) { sendControl({ type:'tap', x:coords.nx, y:coords.ny }); showTapDot(e.clientX, e.clientY); }
  }
}
function onPointerCancel(e) {
  const pd = pointers.get(e.pointerId); if (pd) clearTimeout(pd.longTimer);
  pointers.delete(e.pointerId);
}

/* ── Stats: RTT from candidate-pair ───────────────────────────── */
let _candidateTypeLogged = false; /* one-shot: log the active candidate type once per connection */
async function pollStats() {
  if (!pc || pc.connectionState === 'closed') return;
  try {
    const stats = await pc.getStats();
    stats.forEach(report => {
      if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime != null) {
        lastRtt = Math.round(report.currentRoundTripTime * 1000);
      }
    });
    /* One-shot: on first successful stats read after connection, log the active
       candidate pair's local/remote candidateType.  A value of 'relay' on both
       sides proves the Cloudflare TURN path is in use (?relay=1 test).
       Runs unconditionally (not only in FORCE_RELAY mode) so normal LAN connections
       show 'host'/'srflx' and relay mode clearly shows 'relay'/'relay'. */
    if (!_candidateTypeLogged) {
      const candidatesById = new Map();
      stats.forEach(r => {
        if (r.type === 'local-candidate' || r.type === 'remote-candidate') {
          candidatesById.set(r.id, r);
        }
      });
      stats.forEach(r => {
        if (r.type === 'candidate-pair' && r.state === 'succeeded' && !_candidateTypeLogged) {
          const local  = candidatesById.get(r.localCandidateId);
          const remote = candidatesById.get(r.remoteCandidateId);
          const localType  = local  ? local.candidateType  : '?';
          const remoteType = remote ? remote.candidateType : '?';
          console.log(
            `[iphone-use] active candidate-pair: local=${localType} remote=${remoteType}` +
            (FORCE_RELAY ? '  ← ?relay=1 mode (expect relay/relay)' : '')
          );
          _candidateTypeLogged = true;
        }
      });
    }
  } catch (_) {}
  updateStatusLine();
}

/* ── ICE restart [SIG §restart] ───────────────────────────────── */
function scheduleIceRestart() {
  if (iceRestartTimer) return;
  iceRestartTimer = setTimeout(() => {
    iceRestartTimer = null;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    wsSend({ type:'restart' }); toast('ICE 重连中…');
  }, ICE_RESTART_DEBOUNCE_MS);
}

/* ── WebSocket helpers [SIG] ──────────────────────────────────── */
function wsSend(obj) { if (!ws || ws.readyState !== WebSocket.OPEN) return; try { ws.send(JSON.stringify(obj)); } catch (_) {} }

/* ── PeerConnection ───────────────────────────────────────────── */
async function fetchIceServers() {
  try {
    const resp = await fetch('/turn-creds', { credentials: 'include' });
    if (!resp.ok) return [];
    const data = await resp.json();
    return Array.isArray(data.iceServers) ? data.iceServers : [];
  } catch (_) { return []; }
}
async function buildPeerConnection(iceServers) {
  return new RTCPeerConnection({ iceServers, bundlePolicy:'max-bundle', rtcpMuxPolicy:'require' });
}
async function buildPeerConnectionRelayOnly(iceServers) {
  return new RTCPeerConnection({ iceServers, iceTransportPolicy:'relay', bundlePolicy:'max-bundle', rtcpMuxPolicy:'require' });
}

function wirePc(newPc) {
  if (pc) { try { pc.close(); } catch (_) {} }
  pc = newPc; controlCh = null; moveCh = null;
  _candidateTypeLogged = false; /* reset so each new offer logs its candidate type */
  pc.ontrack = (e) => { video.srcObject = e.streams[0] ?? new MediaStream([e.track]); if (!frozen) tryPlay(); };
  pc.ondatachannel = (e) => {
    const ch = e.channel; ch.binaryType = 'arraybuffer';
    if (ch.label === 'control') { controlCh = ch; ch.onopen = () => { connState = 'connected'; updateStatusLine(); }; ch.onclose = () => { controlCh = null; }; ch.onmessage = onControlMessage; }
    else if (ch.label === 'move') { moveCh = ch; ch.onclose = () => { moveCh = null; }; }
  };
  pc.onicecandidate = (e) => { if (e.candidate) wsSend({ type:'ice', candidate: e.candidate.toJSON() }); };
  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState; connState = s; updateStatusLine();
    if (s === 'disconnected' || s === 'failed') scheduleIceRestart();
    else if (s === 'connected' || s === 'completed') {
      clearTimeout(iceRestartTimer); iceRestartTimer = null;
      if (statsInterval) clearInterval(statsInterval);
      statsInterval = setInterval(pollStats, STATS_INTERVAL_MS);
    }
  };
  pc.onconnectionstatechange = () => {
    connState = pc.connectionState; updateStatusLine();
    if (pc.connectionState === 'failed') scheduleIceRestart();
    if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      showOverlay('disconnected');
    } else if (pc.connectionState === 'connected') {
      /* Only clear a 'disconnected' overlay here; stall detection clears 'stalled'. */
      if (overlayState === 'disconnected') hideOverlay();
    }
  };
}

function onControlMessage(e) {
  if (typeof e.data === 'string') { try { const msg = JSON.parse(e.data); if (msg.type === 'toast') toast(msg.text || ''); } catch (_) {} }
}

/* ── Signaling loop [SIG] ─────────────────────────────────────── */
let relayAttempt = false;
async function connectWs() {
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }
  clearTimeout(iceRestartTimer); iceRestartTimer = null;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  connState = 'connecting'; updateStatusLine();
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => { connState = 'ws-open'; updateStatusLine(); reconnectDelay = RECONNECT_BASE_MS; relayAttempt = false; };
  ws.onerror = () => {};
  ws.onclose = () => {
    connState = 'ws-closed'; updateStatusLine();
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
    clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectWs, reconnectDelay);
  };
  ws.onmessage = async (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
    if (msg.type === 'offer') await handleOffer(msg.sdp);
    else if (msg.type === 'ice' && pc && msg.candidate) { try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (_) {} }
    else if (msg.type === 'phone_status') {
      // Daemon-side truth about the Mirroring window. Keepalive frames keep
      // flowing when the window vanishes, so this signal (not frame flow)
      // drives the "phone gone" overlay.
      // In agent/WDA mode the Mirroring window is INTENTIONALLY gone (we drive
      // on-device + show the MJPEG), so the "phone disconnected — reconnect
      // mirror" overlay would be wrong and misleading. Only show it in mirror
      // mode. Agent mode keeps the live MJPEG with no overlay.
      if (msg.present === false) {
        if (agentMode) { startStills(); hideOverlay(); }
        else { showOverlay('gone'); startStills(); }
      }
      else { if (overlayState === 'gone') hideOverlay(); if (!agentMode) stopStills(); }
    }
    else if (msg.type === 'session_status') {
      // issue #8 (queue + notify): another viewer holds the live session.
      // In agent mode video is MJPEG (per-viewer, no single-viewer lease), so a
      // queued WebRTC session must NOT block the picture.
      if (msg.state === 'queued') { queuedAhead = msg.ahead || 0; if (!agentMode) showOverlay('queued'); }
      else if (msg.state === 'active') { if (overlayState === 'queued') hideOverlay(); }
    }
  };
}
async function handleOffer(sdp) {
  const iceServers = await fetchIceServers();
  /* FORCE_RELAY (?relay=1) always uses relay-only transport; otherwise fall back
     to the relay path only after an SDP error (relayAttempt flag). */
  const newPc = (FORCE_RELAY || relayAttempt)
    ? await buildPeerConnectionRelayOnly(iceServers)
    : await buildPeerConnection(iceServers);
  wirePc(newPc);
  try {
    await pc.setRemoteDescription({ type:'offer', sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    wsSend({ type:'answer', sdp: pc.localDescription.sdp });
  } catch (err) {
    connState = 'sdp-error'; updateStatusLine(); toast('SDP 协商失败');
    if (!relayAttempt) { relayAttempt = true; clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectWs, 500); }
  }
}

/* ── Chrome: text panel + immersive (mobile UI) ───────────────── */
const textPanel = document.getElementById('textPanel');
function openTextPanel() { textPanel.classList.add('open'); setTimeout(() => textInput.focus(), 60); }
function closeTextPanel() { textPanel.classList.remove('open'); textInput.blur(); }
document.getElementById('btnKeyboard').addEventListener('click', () => {
  textPanel.classList.contains('open') ? closeTextPanel() : openTextPanel();
});
document.getElementById('btnTextClose').addEventListener('click', closeTextPanel);
// close the panel right after a send (additive listeners; sendText already ran)
document.getElementById('btnSend').addEventListener('click', () => setTimeout(closeTextPanel, 40));
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') setTimeout(closeTextPanel, 40); });

const btnImmersive = document.getElementById('btnImmersive');
const grabber = document.getElementById('grabber');
const toolbar = document.getElementById('toolbar');

/* Reserve exactly the toolbar's real footprint (incl. its safe-area padding) so
   the video sits right above it — a hardcoded guess was a few px short and left
   the toolbar overlapping the phone's bottom. Immersive mode reclaims the space. */
function syncToolbarReserve() {
  const reserve = document.body.classList.contains('immersive') ? 0 : (toolbar.offsetHeight || 78);
  document.documentElement.style.setProperty('--tb-reserve', reserve + 'px');
  if (gridOn) drawGrid();
}
function setImmersive(on) {
  document.body.classList.toggle('immersive', on);
  syncToolbarReserve();
  if (gridOn) requestAnimationFrame(drawGrid);
}
btnImmersive.addEventListener('click', () => setImmersive(true));
grabber.addEventListener('click', () => setImmersive(false));
window.addEventListener('resize', syncToolbarReserve);
window.addEventListener('orientationchange', () => setTimeout(syncToolbarReserve, 200));
syncToolbarReserve();

/* ── Status pill dot colour ───────────────────────────────────── */
/* Reads overlayState + connState directly (more reliable than text scraping). */
const connDot = document.querySelector('#statusPill .conn-dot');
function paintDot() {
  let cls;
  if (overlayState === 'disconnected' || /(failed|closed|error)/.test(connState)) {
    cls = 'bad';
  } else if (overlayState === 'stalled') {
    cls = 'warn';
  } else if (/(connected|completed)/.test(connState)) {
    cls = 'ok';
  } else {
    cls = 'warn';
  }
  connDot.className = 'conn-dot ' + cls;
}
/* Also keep the MutationObserver so any direct setStatus() call refreshes the dot. */
new MutationObserver(paintDot).observe(statusLine, { childList:true, characterData:true, subtree:true });

/* ── Stall detection ─────────────────────────────────────────── */
/* Timestamps the last rendered frame via requestVideoFrameCallback when
   available (Chrome/Safari), falling back to a 1-second currentTime-delta
   poll (Firefox and older Safari). If no new frame arrives for >STALL_THRESHOLD_MS
   while pc.connectionState === 'connected' → show stalled overlay.
   Any new frame → recovery (hide overlay immediately). */

let _lastFrameTs = 0;         /* performance.now() of last known rendered frame */
let _stallPollId = null;      /* setInterval id for fallback poll */
let _rvfcActive  = false;     /* true when rVFC loop is running */
let _lastKnownTime = -1;      /* video.currentTime at last poll (fallback) */

function _onNewFrame() {
  /* Called every time a frame is painted; resets the stall clock. */
  _lastFrameTs = performance.now();
  if (overlayState === 'stalled') hideOverlay();
}

/* requestVideoFrameCallback loop (Chrome 83+, Safari 15.4+) */
function _rVFCLoop(now, meta) {
  void meta;
  _onNewFrame();
  if (_rvfcActive) video.requestVideoFrameCallback(_rVFCLoop);
}

function _startStallWatch() {
  _lastFrameTs = performance.now();
  _lastKnownTime = video.currentTime;
  if (typeof video.requestVideoFrameCallback === 'function') {
    _rvfcActive = true;
    video.requestVideoFrameCallback(_rVFCLoop);
  } else {
    /* Fallback: poll currentTime + getVideoPlaybackQuality */
    if (_stallPollId) return;
    _stallPollId = setInterval(() => {
      if (video.paused) return;                 /* user-frozen or not started */
      const ct = video.currentTime;
      let newFrame = ct !== _lastKnownTime;
      /* also check decoded frame count if available */
      if (!newFrame && typeof video.getVideoPlaybackQuality === 'function') {
        const q = video.getVideoPlaybackQuality();
        if (q && q.totalVideoFrames > 0) newFrame = q.totalVideoFrames !== (_startStallWatch._lastFrameCount || 0);
        _startStallWatch._lastFrameCount = q ? q.totalVideoFrames : 0;
      }
      if (newFrame) { _lastKnownTime = ct; _onNewFrame(); }
    }, STALL_POLL_INTERVAL);
  }
}

function _stopStallWatch() {
  _rvfcActive = false;
  if (_stallPollId) { clearInterval(_stallPollId); _stallPollId = null; }
}

/* Master stall-checker: runs every second regardless of method */
let _stallCheckId = null;
function _startStallChecker() {
  if (_stallCheckId) return;
  _stallCheckId = setInterval(() => {
    if (frozen || video.paused) return;           /* intentional freeze → ignore */
    if (!pc || pc.connectionState !== 'connected') return; /* let conn-state handler own it */
    if (!video.srcObject) return;                 /* no track yet */
    const age = performance.now() - _lastFrameTs;
    /* 'gone' (daemon-reported window vanished) outranks 'stalled' — don't
       downgrade the message; the phone_status signal owns clearing it. */
    if (age > STALL_THRESHOLD_MS && overlayState !== 'stalled' && overlayState !== 'gone') {
      showOverlay('stalled');
    }
  }, STALL_POLL_INTERVAL);
}
function _stopStallChecker() {
  if (_stallCheckId) { clearInterval(_stallCheckId); _stallCheckId = null; }
}

/* Wire into video lifecycle */
video.addEventListener('playing', () => {
  _lastFrameTs = performance.now();
  _startStallWatch();
  _startStallChecker();
  /* A frame is flowing — clear any stall overlay (but not 'disconnected') */
  if (overlayState === 'stalled') hideOverlay();
});
video.addEventListener('pause', () => {
  /* rVFC stops firing on its own when paused; stop the loop.
     The stall-checker guards with (frozen || video.paused) so won't false-alarm. */
  _stopStallWatch();
});
video.addEventListener('emptied', () => { _stopStallWatch(); _stopStallChecker(); });

/* ── Boot ─────────────────────────────────────────────────────── */
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
video.addEventListener('pause', () => { if (!frozen && !agentMode) playOverlay.classList.remove('hidden'); });
video.addEventListener('playing', () => { playOverlay.classList.add('hidden'); });
video.addEventListener('stalled', tryPlay);
video.addEventListener('waiting', tryPlay);
paintDot();
connectWs();
</script>
</body>
</html>
