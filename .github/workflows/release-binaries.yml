name: Release Binaries

# Trigger on version tags (e.g. v0.2.0) pushed to the repo,
# OR manually via the Actions UI (workflow_dispatch).
# On a tag push  → full release: build + bundle + sign + upload to GitHub Release.
# On manual run  → dry-run: build + bundle + upload zip as a workflow artifact only.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write   # required to create/upload GitHub Release assets

jobs:
  build-macos:
    name: Build macOS binary & create release
    runs-on: macos-14
    # The `secrets` context is NOT available in step `if:` expressions (GitHub
    # rejects the workflow at parse time). Map the gate secrets into job-level
    # env (job env CAN reference secrets); steps gate on `env.*` instead.
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_CERTIFICATE != '' && secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ───────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      # ── Build ────────────────────────────────────────────────────────────────
      # Build for both Apple Silicon and Intel; lipo them into a universal binary.
      - name: Build (arm64)
        run: cargo build --release --locked --bin iphone-remote --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --release --locked --bin iphone-remote --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/iphone-remote \
            target/x86_64-apple-darwin/release/iphone-remote \
            -output target/universal-apple-darwin/release/iphone-remote
          chmod +x target/universal-apple-darwin/release/iphone-remote

      # Expose universal binary where make-app.sh expects it
      - name: Copy universal binary to target/release
        run: |
          mkdir -p target/release
          cp target/universal-apple-darwin/release/iphone-remote target/release/iphone-remote

      # ── Bundle ────────────────────────────────────────────────────────────────
      - name: Build .app bundle
        run: bash scripts/make-app.sh "$GITHUB_WORKSPACE"

      # ── Sign (Developer ID path, only when secrets are present) ──────────────
      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > /tmp/signing_cert.p12
          security import /tmp/signing_cert.p12 \
            -k "$KEYCHAIN" \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm -f /tmp/signing_cert.p12

      - name: Sign with Developer ID
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/sign.sh "$GITHUB_WORKSPACE/iPhoneRemote.app"

      # ── Notarize (only when notarization secrets are present) ──────────────
      # Users get Gatekeeper-clean installs without the "damaged app" prompt.
      - name: Notarize
        if: ${{ env.HAS_NOTARIZE == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="$GITHUB_WORKSPACE/iPhoneRemote.app"
          ZIP_FOR_NOTARIZE="$(mktemp).zip"
          ditto -c -k --keepParent "$APP" "$ZIP_FOR_NOTARIZE"
          xcrun notarytool submit "$ZIP_FOR_NOTARIZE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          rm -f "$ZIP_FOR_NOTARIZE"

      # Note when shipping an unsigned build (no Developer ID secrets configured).
      # install.sh handles local re-signing on the user's machine.
      - name: Note (unsigned build)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: |
          echo "No APPLE_SIGNING_CERTIFICATE secret — shipping unsigned .app."
          echo "install.sh will create a local self-signed cert on the user's machine."

      # ── Package ────────────────────────────────────────────────────────────
      - name: Zip .app bundle
        run: |
          cd "$GITHUB_WORKSPACE"
          ditto -c -k --keepParent iPhoneRemote.app iPhoneRemote.app.zip

      - name: Generate SHA-256 checksum
        run: |
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 iPhoneRemote.app.zip > iPhoneRemote.app.zip.sha256
          cat iPhoneRemote.app.zip.sha256

      # ── Release (tag push only) ────────────────────────────────────────────
      # On a workflow_dispatch run there is no tag ref, so we upload as an
      # artifact instead to allow smoke-testing without creating a release.
      - name: Create GitHub Release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iPhoneRemote.app.zip
            iPhoneRemote.app.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (dry-run / workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneRemote-dry-run
          path: |
            iPhoneRemote.app.zip
            iPhoneRemote.app.zip.sha256
          retention-days: 7
