name: Release Binaries

# Trigger on version tags (e.g. v0.2.0) pushed to the repo,
# OR manually via the Actions UI (workflow_dispatch).
# On a tag push  → full release: build + bundle + sign + upload to GitHub Release.
# On manual run  → dry-run: build + bundle + upload zip as a workflow artifact only.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write   # required to create/upload GitHub Release assets

jobs:
  build-macos:
    name: Build macOS binary & create release
    runs-on: macos-14
    # The `secrets` context is NOT available in step `if:` expressions (GitHub
    # rejects the workflow at parse time). Map the gate secrets into job-level
    # env (job env CAN reference secrets); steps gate on `env.*` instead.
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_CERTIFICATE != '' && secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate installer and release coherence
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/test-install-release-transaction.sh
          bash -n scripts/test-setup-wda-warp-preflight.sh
          bash scripts/test-install-release-transaction.sh
          bash scripts/test-setup-wda-warp-preflight.sh
          bash scripts/test-setup-wda-lock-backoff.sh
          bash scripts/test-setup-wda-icon-injection.sh
          bash scripts/test-setup-wda-runner-repair.sh
          python3 scripts/test-setup-wda-status.py
          python3 scripts/test-setup-wda-runner-product.py
          python3 scripts/test-setup-wda-asc-signing.py
          python3 scripts/test-auto-update.py

          skill_file_count="$(
            find skills/iphone-use -type f -print | wc -l | tr -d '[:space:]'
          )"
          test "$skill_file_count" = "1"
          test -f skills/iphone-use/SKILL.md

          if grep -R -n -E \
            'skills(@[^[:space:]]+)?[[:space:]]+(add|update)([[:space:]]|$)|(npx|pnpx|bunx).*iphone-use' \
            install.sh README.md README.zh-CN.md docs skills/iphone-use; then
            echo "Floating public iphone-use skill installation is forbidden." >&2
            exit 1
          fi

          server_version="$(
            awk -F ' *= *' '$1 == "version" {
              gsub(/"/, "", $2); print $2; exit
            }' crates/server/Cargo.toml
          )"
          core_version="$(
            awk -F ' *= *' '$1 == "version" {
              gsub(/"/, "", $2); print $2; exit
            }' crates/core/Cargo.toml
          )"
          mcp_version="$(
            awk -F ' *= *' '$1 == "version" {
              gsub(/"/, "", $2); print $2; exit
            }' crates/mcp/Cargo.toml
          )"
          test -n "$server_version"
          test "$core_version" = "$server_version"
          test "$mcp_version" = "$server_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$server_version"
          fi

      # ── Rust toolchain ───────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      # ── Build ────────────────────────────────────────────────────────────────
      # Build for both Apple Silicon and Intel; lipo them into a universal binary.
      - name: Build (arm64)
        run: >-
          cargo build --release --locked
          --bin iphone-use --bin iphone-use-mcp
          --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: >-
          cargo build --release --locked
          --bin iphone-use --bin iphone-use-mcp
          --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/iphone-use \
            target/x86_64-apple-darwin/release/iphone-use \
            -output target/universal-apple-darwin/release/iphone-use
          lipo -create \
            target/aarch64-apple-darwin/release/iphone-use-mcp \
            target/x86_64-apple-darwin/release/iphone-use-mcp \
            -output target/universal-apple-darwin/release/iphone-use-mcp
          chmod +x target/universal-apple-darwin/release/iphone-use
          chmod +x target/universal-apple-darwin/release/iphone-use-mcp
          test "$(lipo -archs target/universal-apple-darwin/release/iphone-use)" = "x86_64 arm64" \
            || test "$(lipo -archs target/universal-apple-darwin/release/iphone-use)" = "arm64 x86_64"
          test "$(lipo -archs target/universal-apple-darwin/release/iphone-use-mcp)" = "x86_64 arm64" \
            || test "$(lipo -archs target/universal-apple-darwin/release/iphone-use-mcp)" = "arm64 x86_64"

      # Expose universal binary where make-app.sh expects it
      - name: Copy universal binary to target/release
        run: |
          mkdir -p target/release
          cp target/universal-apple-darwin/release/iphone-use target/release/iphone-use
          cp target/universal-apple-darwin/release/iphone-use-mcp target/release/iphone-use-mcp

      # ── Bundle ────────────────────────────────────────────────────────────────
      - name: Build .app bundle
        run: bash scripts/make-app.sh "$GITHUB_WORKSPACE"

      - name: Verify bundled MCP protocol and multi-step tool
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          binary = "iPhoneUse.app/Contents/MacOS/iphone-use-mcp"
          requests = "\n".join([
              json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "protocolVersion": "2025-03-26",
                      "capabilities": {},
                      "clientInfo": {"name": "release-audit", "version": "1"},
                  },
              }),
              json.dumps({
                  "jsonrpc": "2.0",
                  "method": "notifications/initialized",
              }),
              json.dumps({
                  "jsonrpc": "2.0",
                  "id": 2,
                  "method": "tools/list",
                  "params": {},
              }),
              "",
          ])
          completed = subprocess.run(
              [binary],
              input=requests,
              text=True,
              capture_output=True,
              timeout=15,
              check=True,
          )
          responses = [
              json.loads(line)
              for line in completed.stdout.splitlines()
              if line.strip()
          ]
          listing = next(item for item in responses if item.get("id") == 2)
          tools = listing["result"]["tools"]
          names = [tool["name"] for tool in tools]
          assert len(names) == 20, names
          for required in ("phone_run_steps", "phone_hold", "phone_release_owner", "phone_status"):
              assert required in names, names
          run_steps = next(
              tool for tool in tools if tool["name"] == "phone_run_steps"
          )
          assert "steps" in run_steps["inputSchema"]["properties"], run_steps
          print("Bundled MCP exposes 20 tools including phone_run_steps and phone_hold.")

          flow = subprocess.run(
              [
                  binary,
                  "flow",
                  "validate",
                  "examples/flows/open-spotlight.json",
              ],
              text=True,
              capture_output=True,
              timeout=15,
              check=True,
          )
          validated = json.loads(flow.stdout)
          assert validated["ok"] is True, validated
          assert validated["network"] == "not_contacted", validated
          assert validated["steps"] == 3, validated
          print("Bundled MCP validates saved flows offline.")
          PY

      # ── Sign (Developer ID path, only when secrets are present) ──────────────
      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > /tmp/signing_cert.p12
          security import /tmp/signing_cert.p12 \
            -k "$KEYCHAIN" \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm -f /tmp/signing_cert.p12

      - name: Sign with Developer ID
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/sign.sh "$GITHUB_WORKSPACE/iPhoneUse.app"

      # ── Notarize (only when notarization secrets are present) ──────────────
      # Users get Gatekeeper-clean installs without the "damaged app" prompt.
      - name: Notarize
        if: ${{ env.HAS_NOTARIZE == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="$GITHUB_WORKSPACE/iPhoneUse.app"
          ZIP_FOR_NOTARIZE="$(mktemp).zip"
          ditto -c -k --keepParent "$APP" "$ZIP_FOR_NOTARIZE"
          xcrun notarytool submit "$ZIP_FOR_NOTARIZE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          rm -f "$ZIP_FOR_NOTARIZE"

      # Note when shipping an unsigned build (no Developer ID secrets configured).
      # install.sh handles local re-signing on the user's machine.
      - name: Note (unsigned build)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: |
          echo "No APPLE_SIGNING_CERTIFICATE secret — shipping unsigned .app."
          echo "install.sh will create a local self-signed cert on the user's machine."

      # ── Package ────────────────────────────────────────────────────────────
      - name: Zip .app bundle
        run: |
          cd "$GITHUB_WORKSPACE"
          ditto -c -k --keepParent iPhoneUse.app iPhoneUse.app.zip

      - name: Package standalone MCP bridge
        run: |
          cd "$GITHUB_WORKSPACE"
          package_dir="$(mktemp -d)"
          cp iPhoneUse.app/Contents/MacOS/iphone-use-mcp "$package_dir/iphone-use-mcp"
          chmod 755 "$package_dir/iphone-use-mcp"
          if [[ "$HAS_SIGNING" != "true" ]]; then
            codesign --force --sign - "$package_dir/iphone-use-mcp"
          fi
          codesign --verify --verbose=2 "$package_dir/iphone-use-mcp"
          tar -C "$package_dir" -czf iphone-use-mcp-macos-universal.tar.gz iphone-use-mcp
          test "$(tar -tzf iphone-use-mcp-macos-universal.tar.gz)" = "iphone-use-mcp"
          rm -rf "$package_dir"

      - name: Generate SHA-256 checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 iPhoneUse.app.zip > iPhoneUse.app.zip.sha256
          shasum -a 256 iphone-use-mcp-macos-universal.tar.gz \
            > iphone-use-mcp-macos-universal.tar.gz.sha256
          cat iPhoneUse.app.zip.sha256
          cat iphone-use-mcp-macos-universal.tar.gz.sha256

      # ── Release (tag push only) ────────────────────────────────────────────
      # On a workflow_dispatch run there is no tag ref, so we upload as an
      # artifact instead to allow smoke-testing without creating a release.
      - name: Create GitHub Release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            iPhoneUse.app.zip
            iPhoneUse.app.zip.sha256
            iphone-use-mcp-macos-universal.tar.gz
            iphone-use-mcp-macos-universal.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (dry-run / workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: iPhoneUse-dry-run
          path: |
            iPhoneUse.app.zip
            iPhoneUse.app.zip.sha256
            iphone-use-mcp-macos-universal.tar.gz
            iphone-use-mcp-macos-universal.tar.gz.sha256
          retention-days: 7
